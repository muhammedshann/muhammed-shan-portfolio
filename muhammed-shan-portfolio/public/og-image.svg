<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255, 255, 255, 0.08)" />
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6FD50" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0C0D0B" />
  <rect width="1200" height="630" fill="url(#dotGrid)" />
  <circle cx="1050" cy="150" r="300" fill="url(#glow)" />

  <!-- Outer Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  <rect x="36" y="36" width="1128" height="558" rx="18" fill="none" stroke="#C6FD50" stroke-width="2" stroke-opacity="0.25" />

  <!-- Eyebrow Pill -->
  <g transform="translate(90, 95)">
    <rect width="450" height="42" rx="21" fill="#131311" stroke="#C6FD50" stroke-width="1.5" />
    <circle cx="24" cy="21" r="5" fill="#C6FD50" />
    <text x="40" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">FULL STACK &amp; MOBILE • AI-POWERED SPEED</text>
  </g>

  <!-- Main Headline -->
  <text x="90" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#FAFAFA" letter-spacing="-1.5">Muhammed Shan</text>

  <!-- Subtitle -->
  <text x="90" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#C6FD50" letter-spacing="-0.5">
    Your Web &amp; Mobile App, Handled.
  </text>

  <!-- Description paragraph -->
  <text x="90" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#B9B9B7">
    Custom-built web &amp; mobile apps (iOS &amp; Android), live in weeks, not months.
  </text>
  <text x="90" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#B9B9B7">
    Multi-stack APIs, React Native, Expo &amp; modern AI engineering workflows.
  </text>

  <!-- Tech Badges -->
  <g transform="translate(90, 465)">
    <!-- Badge 1: Web Apps -->
    <rect x="0" y="0" width="125" height="38" rx="8" fill="#161714" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <text x="62" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#FAFAFA" text-anchor="middle">WEB APPS</text>

    <!-- Badge 2: iOS & Android -->
    <rect x="140" y="0" width="195" height="38" rx="8" fill="#161714" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <text x="237" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#61DAFB" text-anchor="middle">iOS &amp; ANDROID APPS</text>

    <!-- Badge 3: React Native / Expo -->
    <rect x="350" y="0" width="190" height="38" rx="8" fill="#161714" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <text x="445" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#FAFAFA" text-anchor="middle">REACT NATIVE / EXPO</text>

    <!-- Badge 4: Multi-Stack APIs -->
    <rect x="555" y="0" width="180" height="38" rx="8" fill="#161714" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <text x="645" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#FAFAFA" text-anchor="middle">MULTI-STACK APIS</text>

    <!-- Badge 5: AI Workflows -->
    <rect x="750" y="0" width="155" height="38" rx="8" fill="#161714" stroke="#C6FD50" stroke-width="1.5" />
    <text x="827" y="24" font-family="monospace" font-size="13" font-weight="700" fill="#C6FD50" text-anchor="middle">AI WORKFLOWS</text>
  </g>

  <!-- Domain Branding on Bottom-Right -->
  <g transform="translate(860, 525)">
    <rect x="0" y="0" width="250" height="42" rx="10" fill="#C6FD50" />
    <text x="125" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#131311" text-anchor="middle" letter-spacing="0.5">muhammedshan.online</text>
  </g>
</svg>